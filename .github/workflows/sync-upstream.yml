name: Sync Upstream Code Only

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. 检出你的仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 拉取原作者更新并智能合并个人数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/YYsuni/2025-blog-public.git
          git fetch upstream

          # 记录当前你自己的版本与上游最新版本
          BEFORE_MERGE=$(git rev-parse HEAD)
          UPSTREAM_HEAD=$(git rev-parse upstream/main)

          # 合并上游代码
          git merge upstream/main -X ours --no-commit --no-ff || true

          # 1. 彻底保护你的纯内容目录（文章、图片、仓库常量），剔除原作者新增的文章
          CONTENT_PATHS=(
            "public/blogs"
            "public/images"
            "src/consts.ts"
          )

          for path in "${CONTENT_PATHS[@]}"; do
            git rm -rf --ignore-unmatch "$path"
            git clean -fd "$path" || true
            git checkout "$BEFORE_MERGE" -- "$path" 2>/dev/null || true
          done

          # 2. 智能深度合并 src/config 下的 JSON 配置文件
          # 作用：既保留你改过的站点信息/卡片位置，又自动补齐原作者新增的卡片默认属性（如 offsetX）
          mkdir -p /tmp/upstream_config /tmp/ours_config
          for file in src/config/*.json; do
            [ -e "$file" ] || continue
            fname=$(basename "$file")
            
            # 分别提取上游最新配置和你原本的配置
            if git show "$UPSTREAM_HEAD:$file" > "/tmp/upstream_config/$fname" 2>/dev/null && \
               git show "$BEFORE_MERGE:$file" > "/tmp/ours_config/$fname" 2>/dev/null; then
              # 使用 jq 深度合并：以 upstream 为基底，用你的配置覆盖同名字段
              jq -s '.[0] * .[1]' "/tmp/upstream_config/$fname" "/tmp/ours_config/$fname" > "$file"
              git add "$file"
              echo "Merged config: $file"
            fi
          done

          # 3. 提交并推送
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream code and deep-merge personal configs"
            git push origin main
            echo "✅ 同步与配置合并成功！"
          else
            echo "✨ 当前代码已是最新，无需更新。"
          fi
